name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moss-release
  queue: max

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Cargo environment
        run: |
          echo "CARGO_BUILD_JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          echo "MOSS_MAPLIBRE_CACHE_DIR=$RUNNER_TEMP/moss-maplibre-native" >> "$GITHUB_ENV"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest

      - name: Cache MapLibre native SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/moss-maplibre-native
          key: maplibre-macos-arm64-${{ hashFiles('crates/moss-maplibre/build.rs') }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-macos-arm64
          cache-on-failure: true
          save-if: ${{ matrix.shard == 1 }}

      - name: Test Python scripts
        if: matrix.shard == 1
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test Rust workspace (shard ${{ matrix.shard }}/2)
        run: |
          cargo nextest run \
            --profile ci \
            --workspace \
            --lib \
            --bins \
            --tests \
            --locked \
            --partition count:${{ matrix.shard }}/2

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      signed: ${{ steps.keys.outputs.signed }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Import Apple Developer ID certificate
        id: apple_sign
        env:
          APPLE_CERTIFICATE_P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_B64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${APPLE_CERTIFICATE_P12_B64:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            keychain="$RUNNER_TEMP/moss-signing.keychain-db"
            keychain_pw="$(uuidgen)"
            cert_path="$RUNNER_TEMP/certificate.p12"
            g2_ca_path="$RUNNER_TEMP/DeveloperIDG2CA.cer"
            printf '%s' "$APPLE_CERTIFICATE_P12_B64" | base64 --decode > "$cert_path"
            curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$g2_ca_path"
            security create-keychain -p "$keychain_pw" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_pw" "$keychain"
            security import "$g2_ca_path" -k "$keychain" -T /usr/bin/codesign
            security import "$cert_path" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pw" "$keychain"
            security list-keychains -d user -s "$keychain" login.keychain-db
            security default-keychain -s "$keychain"
            rm -f "$cert_path" "$g2_ca_path"
            if ! security find-identity -v -p codesigning "$keychain" | grep -Fq "$APPLE_SIGNING_IDENTITY"; then
              echo "Expected signing identity was not found in the imported certificate." >&2
              security find-identity -p codesigning "$keychain" >&2 || true
              exit 1
            fi
            if [ -n "${APPLE_NOTARY_KEY_P8_B64:-}" ] && [ -n "${APPLE_NOTARY_KEY_ID:-}" ] && [ -n "${APPLE_NOTARY_ISSUER_ID:-}" ]; then
              key_path="$RUNNER_TEMP/AuthKey.p8"
              printf '%s' "$APPLE_NOTARY_KEY_P8_B64" | base64 --decode > "$key_path"
              chmod 600 "$key_path"
              xcrun notarytool history --key "$key_path" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" >/dev/null
              rm -f "$key_path"
            elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              xcrun notarytool history --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" >/dev/null
            else
              echo "Developer ID signing is enabled, but notarization credentials are missing or empty." >&2
              echo "Set APPLE_ID, APPLE_APP_PASSWORD, and APPLE_TEAM_ID (or App Store Connect API key secrets)." >&2
              exit 1
            fi
            echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select version
        id: version
        run: echo "tag=$(python3 scripts/release_version.py "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Configure Cargo environment
        run: |
          echo "CARGO_BUILD_JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          echo "MOSS_MAPLIBRE_CACHE_DIR=$RUNNER_TEMP/moss-maplibre-native" >> "$GITHUB_ENV"

      - name: Cache MapLibre native SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/moss-maplibre-native
          key: maplibre-macos-arm64-${{ hashFiles('crates/moss-maplibre/build.rs') }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-macos-arm64
          cache-on-failure: true

      - name: Derive update public key
        id: keys
        env:
          MOSS_UPDATE_SIGNING_KEY: ${{ secrets.MOSS_UPDATE_SIGNING_KEY }}
          CONFIGURED_PUBLIC_KEY: ${{ vars.MOSS_UPDATE_PUBLIC_KEY }}
        run: |
          cargo build --release -p moss-updater --locked
          if [ -n "${MOSS_UPDATE_SIGNING_KEY:-}" ]; then
            pubkey=$(target/release/moss-update-helper pubkey --signing-key-env MOSS_UPDATE_SIGNING_KEY)
            if [ -n "${CONFIGURED_PUBLIC_KEY:-}" ] && [ "$CONFIGURED_PUBLIC_KEY" != "$pubkey" ]; then
              echo "MOSS_UPDATE_PUBLIC_KEY variable does not match MOSS_UPDATE_SIGNING_KEY secret." >&2
              exit 1
            fi
            echo "public_key=$pubkey" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "public_key=${CONFIGURED_PUBLIC_KEY:-}" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package Moss
        env:
          MOSS_VERSION: ${{ steps.version.outputs.tag }}
          MOSS_RELEASE_BUILD: "1"
          MOSS_UPDATE_PUBLIC_KEY: ${{ steps.keys.outputs.public_key }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple_sign.outputs.enabled == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_SIGNING_KEYCHAIN: ${{ steps.apple_sign.outputs.enabled == 'true' && steps.apple_sign.outputs.keychain || '' }}
        run: |
          MOSS_VERSION="${MOSS_VERSION#v}" scripts/package-macos.sh
          ditto -c -k --sequesterRsrc --keepParent dist/Moss.app "dist/Moss-${{ steps.version.outputs.tag }}-macos-arm64.zip"

      - name: Notarize and staple Moss
        if: steps.apple_sign.outputs.enabled == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APPLE_NOTARY_KEY_P8_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_B64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          archive="dist/Moss-${TAG}-macos-arm64.zip"
          notarized=false
          if [ -n "${APPLE_NOTARY_KEY_P8_B64:-}" ] && [ -n "${APPLE_NOTARY_KEY_ID:-}" ] && [ -n "${APPLE_NOTARY_ISSUER_ID:-}" ]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_NOTARY_KEY_P8_B64" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            xcrun notarytool submit "$archive" \
              --key "$key_path" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --wait
            rm -f "$key_path"
            notarized=true
          elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            xcrun notarytool submit "$archive" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            notarized=true
          fi
          if [ "$notarized" != true ]; then
            echo "Notarization did not run: check notarization secrets." >&2
            exit 1
          fi
          xcrun stapler staple dist/Moss.app
          xcrun stapler validate dist/Moss.app
          spctl --assess --type execute --verbose=4 dist/Moss.app
          rm -f "$archive"
          ditto -c -k --sequesterRsrc --keepParent dist/Moss.app "$archive"

      - name: Sign update manifest
        if: steps.keys.outputs.signed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MOSS_UPDATE_SIGNING_KEY: ${{ secrets.MOSS_UPDATE_SIGNING_KEY }}
          MOSS_UPDATE_PUBLIC_KEY: ${{ steps.keys.outputs.public_key }}
        run: |
          archive="dist/Moss-${TAG}-macos-arm64.zip"
          manifest="dist/latest.json"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Moss-${TAG}-macos-arm64.zip"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          target/release/moss-update-helper manifest \
            --version "${TAG#v}" \
            --archive "$archive" \
            --url "$download_url" \
            --release-url "$release_url" \
            --platform macos-arm64 \
            --min-macos 14.0 \
            --signing-key-env MOSS_UPDATE_SIGNING_KEY \
            --output "$manifest"
          target/release/moss-update-helper verify-manifest \
            --public-key "$MOSS_UPDATE_PUBLIC_KEY" \
            --manifest "$manifest" \
            --archive "$archive" \
            --platform macos-arm64

      - name: Stage release assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SIGNED: ${{ steps.keys.outputs.signed }}
        run: |
          mkdir -p dist/release-assets
          mv "dist/Moss-${TAG}-macos-arm64.zip" dist/release-assets/
          if [ "$SIGNED" = "true" ] && [ -f dist/latest.json ]; then
            mv dist/latest.json dist/release-assets/
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moss-release-assets
          path: dist/release-assets
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Clean up signing keychain
        if: always() && steps.apple_sign.outputs.enabled == 'true'
        env:
          KEYCHAIN: ${{ steps.apple_sign.outputs.keychain }}
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer" "$RUNNER_TEMP/AuthKey.p8"

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: moss-release-assets
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          archive="dist/Moss-${TAG}-macos-arm64.zip"
          manifest="dist/latest.json"
          files=("$archive")
          if [ "$SIGNED" = "true" ]; then
            if [ ! -f "$manifest" ]; then
              echo "Expected signed manifest $manifest was not found." >&2
              exit 1
            fi
            files+=("$manifest")
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Moss $TAG" --generate-notes
          fi
