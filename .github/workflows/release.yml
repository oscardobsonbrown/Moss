name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moss-release
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          cargo test --workspace --locked --quiet -- --test-threads=1

      - name: Select version
        id: version
        run: echo "tag=$(python3 scripts/release_version.py "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Build and package Moss
        env:
          MOSS_VERSION: ${{ steps.version.outputs.tag }}
          MOSS_RELEASE_BUILD: "1"
          MOSS_UPDATE_PUBLIC_KEY: ${{ vars.MOSS_UPDATE_PUBLIC_KEY }}
        run: |
          MOSS_VERSION="${MOSS_VERSION#v}" scripts/package-macos.sh
          ditto -c -k --sequesterRsrc --keepParent dist/Moss.app "dist/Moss-${{ steps.version.outputs.tag }}-macos-arm64.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          archive="dist/Moss-${TAG}-macos-arm64.zip"
          if assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null); then
            if ! printf '%s\n' "$assets" | grep -Fx "${archive##*/}" >/dev/null; then
              gh release upload "$TAG" "$archive"
            fi
          else
            gh release create "$TAG" "$archive" --target "$GITHUB_SHA" --title "Moss $TAG" --generate-notes
          fi
