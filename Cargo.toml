[workspace]
members = ["crates/rotion-core", "crates/rotion-engine", "crates/rotion-app"]
default-members = ["crates/rotion-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rusqlite = { version = "0.41.1", features = ["bundled", "functions"] }
rotion-core = { path = "crates/rotion-core" }
rotion-engine = { path = "crates/rotion-engine" }

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
debug = 1
incremental = true

[profile.perf]
inherits = "release"
debug = false
incremental = false

