[workspace]
members = ["crates/moss-core", "crates/moss-engine", "crates/moss-app"]
default-members = ["crates/moss-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rusqlite = { version = "0.41.1", features = ["bundled", "functions"] }
moss-core = { path = "crates/moss-core" }
moss-engine = { path = "crates/moss-engine" }

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
debug = 1
incremental = true

[profile.perf]
inherits = "release"
debug = false
incremental = false

[profile.rune-hot]
inherits = "release"
debug = 0
incremental = true

