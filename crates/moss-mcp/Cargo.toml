[package]
name = "moss-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
rmcp = { version = "3.10", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
